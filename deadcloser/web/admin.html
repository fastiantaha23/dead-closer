<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Admin - Dead Closer</title>
<meta name="robots" content="noindex">
<link rel="stylesheet" href="style.css">
<style>
  .page { padding: 28px 0 56px; }
  .kpis { display: grid; grid-template-columns: repeat(5, 1fr); gap: 12px; margin-bottom: 16px; }
  .two { display: grid; grid-template-columns: minmax(0, 1.2fr) minmax(0, 1fr); gap: 16px; align-items: start; margin-top: 16px; }
  tr.click { cursor: pointer; } tr.click:hover td { background: var(--chip); }
  .scroll { max-height: 420px; overflow: auto; }
  .login { max-width: 420px; margin: 40px auto; }
  .login .panel { padding: 20px; }
  .thread { font: 11px var(--mono); color: var(--muted); }
  @media (max-width: 860px) { .kpis { grid-template-columns: repeat(2, 1fr); } .two { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<nav class="top"><div class="wrap">
  <a class="logo" href="./"><i></i>Dead Closer</a>
  <div class="links"><a href="./">Overview</a><a href="chat.html">Chat</a><a href="admin.html">Admin</a><button class="btn" id="logout" hidden>Log out</button></div>
</div></nav>

<div class="wrap page">
  <div class="login" id="login"><div class="panel">
    <h2 style="font-size:22px">Admin dashboard</h2>
    <p class="sub" style="margin-bottom:12px">Enter the admin key set on the server (<code>DEADCLOSER_ADMIN_KEY</code>). It is kept in this tab only.</p>
    <form id="loginform"><input type="password" id="key" placeholder="Admin key" autocomplete="off" style="width:100%; margin-bottom:10px" aria-label="Admin key">
      <button class="btn primary" style="width:100%; justify-content:center">Open dashboard</button></form>
    <div class="note" id="loginerr" style="display:none; color:var(--bad)"></div>
  </div></div>

  <div id="dash" hidden>
    <div class="kpis" id="kpis"></div>
    <div class="two">
      <div class="panel"><h3><span>Users and leads</span><span class="clock" id="count"></span></h3>
        <div class="scroll"><table id="users"></table></div></div>
      <div class="panel"><h3><span id="detail-title">Select a user</span></h3>
        <div class="brain" id="detail"><span class="clock">Click a row to see the conversation, memory, visits and decision log.</span></div></div>
    </div>
    <div class="two">
      <div class="panel"><h3><span>Businesses</span></h3><div class="scroll"><table id="tenants"></table></div></div>
      <div class="panel"><h3><span>Safety and decision events</span><span class="clock" id="llm"></span></h3><div class="brain" id="events"></div></div>
    </div>
  </div>
</div>
<script src="config.js"></script>
<script>
(function () {
  "use strict";
  const $ = (s) => document.querySelector(s);
  let API = new URLSearchParams(location.search).get("api") || window.DEADCLOSER_API || "";
  if (API && !API.endsWith("/")) API += "/";
  let KEY = ""; try { KEY = sessionStorage.getItem("dc_admin") || ""; } catch (e) {}
  const money = (c) => "$" + (c / 100).toLocaleString("en-US", { maximumFractionDigits: 0 });
  const when = (ts) => ts ? new Date(ts * 1000).toLocaleString("en-US", { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" }) : "-";
  const esc = (s) => String(s == null ? "" : s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  async function api(path) {
    const r = await fetch(API + path, { headers: { "X-Admin-Key": KEY } });
    if (r.status === 403) throw new Error("bad key"); if (!r.ok) throw new Error(r.status); return r.json();
  }
  async function load() {
    const ov = await api("admin/overview");
    $("#login").hidden = true; $("#dash").hidden = false; $("#logout").hidden = false;
    const tot = ov.tenants.reduce((a, t) => { a.leads += t.leads; a.visits += t.visits; a.cents += t.billing.total_cents; return a; }, { leads: 0, visits: 0, cents: 0 });
    $("#kpis").innerHTML = [["Users / leads", tot.leads], ["Messages", ov.messages], ["Visits booked", tot.visits], ["Fees (pending + earned)", money(tot.cents)], ["Storage", ov.storage]]
      .map(([k, v]) => `<div class="stat"><b>${esc(v)}</b><span>${esc(k)}</span></div>`).join("");
    $("#llm").textContent = "model: " + ov.llm;
    $("#tenants").innerHTML = "<thead><tr><th>Business</th><th>Type</th><th class='num'>Leads</th><th class='num'>Visits</th><th class='num'>Pending</th><th class='num'>Earned</th></tr></thead><tbody>" +
      ov.tenants.map((t) => `<tr><td>${esc(t.name)}${t.is_demo ? " <span class='pill'>demo</span>" : ""}</td><td>${esc(t.vertical)}</td><td class="num">${t.leads}</td><td class="num">${t.visits}</td><td class="num">${money(t.billing.pending_cents)}</td><td class="num">${money(t.billing.earned_cents)}</td></tr>`).join("") + "</tbody>";
    $("#events").innerHTML = '<ul class="list">' + Object.entries(ov.audit_counts).map(([k, n]) => `<li><span class="k">${esc(k)}</span><span>${n}</span></li>`).join("") + "</ul><div class='subhead'>Lead status</div><ul class='list'>" +
      Object.entries(ov.lead_status).map(([k, n]) => `<li><span class="k">${esc(k)}</span><span>${n}</span></li>`).join("") + "</ul>";
    const us = await api("admin/users?limit=200");
    $("#count").textContent = us.length + " shown";
    $("#users").innerHTML = "<thead><tr><th>User</th><th>Status</th><th class='num'>Budget</th><th class='num'>Msgs</th><th>Last</th></tr></thead><tbody>" +
      us.map((u) => `<tr class="click" data-t="${esc(u.tenant_id)}" data-l="${esc(u.id)}"><td>${esc(u.user_id || u.name || u.id)}</td><td><span class="pill ${esc(u.status)}">${esc(u.status)}</span></td><td class="num">${u.budget_max ? "$" + u.budget_max.toLocaleString("en-US") : "-"}</td><td class="num">${u.msgs}</td><td>${when(u.last_in_at || u.created_at)}</td></tr>`).join("") + "</tbody>";
    document.querySelectorAll("tr.click").forEach((tr) => (tr.onclick = () => detail(tr.dataset.t, tr.dataset.l)));
  }
  async function detail(t, l) {
    const v = await api(`admin/users/${encodeURIComponent(t)}/${encodeURIComponent(l)}`);
    $("#detail-title").textContent = v.lead.user_id || v.lead.name || v.lead.id;
    const mem = Object.entries(v.memory).map(([k, m]) => `<li><span class="k">${esc(k)}</span><span>${esc(m.value)}</span></li>`).join("") || "<li><span class='k'>empty</span></li>";
    const msgs = v.messages.slice(-30).map((m) => `<div class="msg ${m.direction === "in" ? "lead" : "agent"}" style="max-width:100%; margin:4px 0">${esc(m.body)}<small>${when(m.ts)} <span class="thread">${esc(m.thread_id || "")}</span></small></div>`).join("");
    const vis = v.visits.map((x) => `<li><span class="k">${esc(x.status)}</span><span>${when(x.start_ts)} ${x.billable ? "· billable" : "· not billable"}</span></li>`).join("") || "<li><span class='k'>none</span></li>";
    const aud = v.audit.map((a) => `<li><span class="k">${esc(a.event)}</span><span>${esc(JSON.stringify(a.detail).slice(0, 60))}</span></li>`).join("") || "<li><span class='k'>none</span></li>";
    $("#detail").innerHTML = `<div class="row"><span>Status</span><b>${esc(v.lead.status)}</b></div><div class="row"><span>Score / qualified</span><b>${v.lead.score} / ${v.lead.qualified ? "yes" : "no"}</b></div>
      <div class="subhead">Long-term memory</div><ul class="list">${mem}</ul><div class="subhead">Visits</div><ul class="list">${vis}</ul><div class="subhead">Decision log</div><ul class="list">${aud}</ul>
      <div class="subhead">Conversation</div><div>${msgs}</div>`;
  }
  async function login(key) {
    KEY = key;
    try { await load(); try { sessionStorage.setItem("dc_admin", KEY); } catch (e) {} $("#loginerr").style.display = "none"; }
    catch (e) { KEY = ""; $("#loginerr").style.display = "block"; $("#loginerr").textContent = e.message === "bad key" ? "That key was not accepted." : "Could not reach the API (" + e.message + ")."; }
  }
  $("#loginform").onsubmit = (e) => { e.preventDefault(); login($("#key").value); };
  $("#logout").onclick = () => { try { sessionStorage.removeItem("dc_admin"); } catch (e) {} location.reload(); };
  if (KEY) login(KEY);
})();
</script>
</body>
</html>
