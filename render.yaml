# Render (free tier) alternative to Hugging Face Spaces: Render -> New -> Blueprint -> pick this repo.
# Memory lives in a free hosted Postgres (Neon / Supabase), NOT on Render's ephemeral disk.
services:
  - type: web
    name: dead-closer-api
    runtime: docker
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL            # postgresql://... from Neon or Supabase (add in the dashboard)
        sync: false
      - key: ANTHROPIC_API_KEY       # your workshop key (add in the dashboard; never commit it)
        sync: false
      - key: DEADCLOSER_ADMIN_KEY    # protects /admin/* and the admin dashboard
        generateValue: true
      - key: DEADCLOSER_MODEL
        value: claude-haiku-5-5
      - key: DEADCLOSER_LLM
        value: auto
      - key: CHAT_TENANT
        value: demo_realty
      - key: CORS_ORIGINS
        value: "*"
